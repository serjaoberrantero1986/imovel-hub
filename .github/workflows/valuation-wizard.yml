name: Validar cadastro unificado e avaliação opcional

on:
  push:
    branches: ['main']
  pull_request:
    paths:
      - 'src/components/properties/**'
      - 'src/lib/valuation/**'
      - 'lib/geckoContracts.mjs'
      - 'api/valuation-search.js'
      - 'api/valuation-credits.js'
      - 'supabase/migrations/20261022000002_valuation_candidates_preserved.sql'
      - 'scripts/test-valuation-guided.mjs'
      - 'scripts/test-valuation-subject-safety.mjs'
      - 'src/lib/geocoding.ts'
      - 'src/lib/supabaseCrud.ts'
      - 'src/context/AppContext.tsx'
      - 'src/views/MyPropertiesView.tsx'
      - 'supabase/migrations/*valuation*'
      - '.github/workflows/valuation-wizard.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - name: Auditoria de comparáveis e permissões
        run: node --test scripts/test-valuation-engine.mjs scripts/test-valuation-workspace.mjs scripts/test-valuation-wizard.mjs scripts/test-valuation-guided.mjs scripts/test-valuation-subject-safety.mjs
      - name: TypeScript
        run: bun run lint
      - name: Build
        run: bun run build
