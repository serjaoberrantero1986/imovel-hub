    <!-- Windows Main Tower -->
    <rect x="60" y="105" width="28" height="28" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="108" y="105" width="28" height="28" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="60" y="150" width="28" height="28" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="108" y="150" width="28" height="28" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="60" y="195" width="28" height="28" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="108" y="195" width="28" height="28" rx="6" fill="#ffffff" opacity="0.9" />
    <!-- Door -->
    <rect x="84" y="235" width="32" height="35" rx="6" fill="#0f172a" />
    <!-- Windows Secondary Wing -->
    <rect x="195" y="155" width="22" height="22" rx="4" fill="#ffffff" opacity="0.8" />
    <rect x="230" y="155" width="22" height="22" rx="4" fill="#ffffff" opacity="0.8" />
    <rect x="195" y="195" width="22" height="22" rx="4" fill="#ffffff" opacity="0.8" />
    <rect x="230" y="195" width="22" height="22" rx="4" fill="#ffffff" opacity="0.8" />
